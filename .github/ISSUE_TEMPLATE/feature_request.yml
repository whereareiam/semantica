name: Suggestion
description: Suggest a new feature or a change to existing behavior.
labels:
  - suggestion
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What your project or your translators are trying to do and what stops you today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How Semantica could solve it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other solutions you considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Format
        - Syntax
        - Lookup
        - Layers
        - Checks
        - Files
        - Bundles
        - Adventure
        - CLI
        - Testing
        - API
        - Other
